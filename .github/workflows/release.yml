---
name: release

# Build the static, dependency-free vfu_kvssd binary for x86_64 and aarch64
# (Zig cross-compiles both from one runner) and publish them to a GitHub
# release, each also as a deb for hosts that install with apt. Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # Run the end-to-end QEMU bring-up against the tagged commit before any
  # artifact ships, so a regression in the device path cannot land in a
  # published release.
  qemu-kvssd:
    uses: ./.github/workflows/qemu-kvssd.yml

  release:
    needs: qemu-kvssd
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Zig ${{ env.ZIG_VERSION }}
      run: |
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
        mkdir -p /opt/zig
        tar -C /opt/zig --strip-components=1 -xf /tmp/zig.tar.xz
        echo "/opt/zig" >> "$GITHUB_PATH"

    - name: Build static binaries (x86_64 + aarch64)
      run: |
        set -eu
        mkdir -p dist
        ver="${GITHUB_REF_NAME#v}"   # tag v0.1.0 -> 0.1.0
        for tgt in x86_64-linux-musl aarch64-linux-musl; do
          arch=${tgt%%-*}
          zig build -Dtarget="$tgt" -Dstatic=true -Doptimize=ReleaseSafe -Dversion="$ver"
          out="dist/vfu_kvssd-${ver}-${arch}-linux"
          cp zig-out/bin/vfu_kvssd "$out"
          file "$out"
          # Sanity: must be statically linked.
          file "$out" | grep -q "statically linked" || { echo "ERROR: $out not static"; exit 1; }
        done
        # cijoe's tasks/deb.yaml packages both and checks the amd64 one in a fresh Ubuntu
        docker run --rm -v "$PWD:/src" -w /src/cijoe -e KVSSD_SRC=/src -e KVSSD_VERSION="$ver" \
          -e KVSSD_OUT=/src/dist -e KVSSD_BIN_X86_64="/src/dist/vfu_kvssd-${ver}-x86_64-linux" \
          -e KVSSD_BIN_AARCH64="/src/dist/vfu_kvssd-${ver}-aarch64-linux" ubuntu:26.04 bash -c \
          'apt-get -qq update && apt-get -qq install -y pipx >/dev/null && pipx install -q cijoe==0.9.61 &&
           ~/.local/bin/cijoe tasks/deb.yaml -c configs/packaging.toml --monitor -o cijoe-output/deb'
        (cd dist && sha256sum vfu_kvssd-* vfio-user-kvssd_*.deb > SHA256SUMS)
        ls -lh dist

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cijoe-report-deb
        path: cijoe/cijoe-output/deb/report.html
        if-no-files-found: warn

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          dist/vfu_kvssd-*-linux
          dist/vfio-user-kvssd_*.deb
          dist/SHA256SUMS
